name: taskflow-backend

services:
  postgres:
    image: postgres:15
    container_name: taskflow_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-taskflow}
      POSTGRES_USER: ${DB_USER:-taskflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - taskflow_internal

  redis:
    image: redis:7-alpine
    container_name: taskflow_redis_prod
    restart: unless-stopped
    networks:
      - taskflow_internal

  minio:
    image: minio/minio:latest
    container_name: taskflow_minio_prod
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin_prod}
      MINIO_BROWSER: "on"
      MINIO_CONSOLE_ADDRESS: ":9001"
    volumes:
      - minio_data_prod:/data
    networks:
      - taskflow_internal
      - taskflow_external

  minio_init:
    image: minio/mc:latest
    container_name: taskflow_minio_init_prod
    depends_on:
      - minio
    networks:
      - taskflow_internal
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin_prod}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 \"$MINIO_ACCESS_KEY\" \"$MINIO_SECRET_KEY\"; do sleep 1; done;
      if ! mc ls local/public >/dev/null 2>&1; then
        mc mb -p local/public;
      fi;
      mc anonymous set download local/public;
      if ! mc ls local/private >/dev/null 2>&1; then
        mc mb -p local/private;
      fi;
      mc anonymous set none local/private;
      exit 0;
      "

  backend:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: taskflow_backend_prod
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
      - minio
      - minio_init
    environment:
      DJANGO_ENV: prod
      DJANGO_SETTINGS_MODULE: config.settings.base
      RUN_MIGRATIONS: "true"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-to-a-secure-key-in-production}
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      DB_ENGINE: postgres
      DB_NAME: ${DB_NAME:-taskflow}
      DB_USER: ${DB_USER:-taskflow}
      DB_PASSWORD: ${DB_PASSWORD:-taskflow_prod_password_change_me}
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://taskflow.test}
      ACCESS_TOKEN_LIFETIME_MINUTES: "15"
      REFRESH_TOKEN_LIFETIME_DAYS: "7"
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-False}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-no-reply@taskflow.local}
      FRONTEND_URL: ${FRONTEND_URL:-https://app.taskflow.test}
      PASSWORD_RESET_TOKEN_TTL_MINUTES: ${PASSWORD_RESET_TOKEN_TTL_MINUTES:-30}
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-minio.test} 
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin_prod}
      MINIO_BUCKET: taskflow-media
      MINIO_PUBLIC_BUCKET: public
      MINIO_PRIVATE_BUCKET: private
      MINIO_USE_SSL: ${MINIO_USE_SSL:-False}
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application
    networks:
      - taskflow_internal
      - taskflow_external

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: taskflow_celery_worker_prod
    restart: unless-stopped
    depends_on:
      - backend
      - redis
    environment:
      DJANGO_ENV: prod
      DJANGO_SETTINGS_MODULE: config.settings.base
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-to-a-secure-key-in-production}
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      DB_ENGINE: postgres
      DB_NAME: ${DB_NAME:-taskflow}
      DB_USER: ${DB_USER:-taskflow}
      DB_PASSWORD: ${DB_PASSWORD:-taskflow_prod_password_change_me}
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin_prod}
      MINIO_BUCKET: taskflow-media
      MINIO_PUBLIC_BUCKET: public
      MINIO_PRIVATE_BUCKET: private
      MINIO_USE_SSL: ${MINIO_USE_SSL:-False}
    command: celery -A config worker -l info
    networks:
      - taskflow_internal

networks:
  taskflow_internal:
    driver: bridge
  taskflow_external:
    external: true
    name: taskflow_network

volumes:
  postgres_data_prod:
  minio_data_prod:
